name: Build MotionStudioAI APK from uploaded project ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE="MotionStudioAI_ReadyToBuild.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle' -print -quit)"
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts inside the uploaded ZIP."
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Kotlin JVM target with existing Java 8 target
        run: |
          cat > "$RUNNER_TEMP/align-jvm.gradle" <<'EOF'
          gradle.projectsEvaluated {
              allprojects { project ->
                  project.tasks.matching { task ->
                      task.name.startsWith("compile") && task.name.endsWith("Kotlin")
                  }.configureEach { task ->
                      if (task.hasProperty("kotlinOptions")) {
                          task.kotlinOptions.jvmTarget = "1.8"
                          task.doFirst {
                              println "MotionStudioAI JVM alignment: Kotlin target = ${task.kotlinOptions.jvmTarget}; Java target = 1.8"
                          }
                      }
                  }
              }
          }
          EOF
          echo "Created Kotlin JVM alignment script:"
          cat "$RUNNER_TEMP/align-jvm.gradle"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -I "$RUNNER_TEMP/align-jvm.gradle" -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionStudioAI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
