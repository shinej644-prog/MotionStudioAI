name: Build MotionStudioAI APK from uploaded project ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE="MotionStudioAI_ReadyToBuild.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle' -print -quit)"
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts inside the uploaded ZIP."
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin targets in extracted project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted")
          for path in root.rglob("*"):
              if not path.is_file() or path.name not in ("build.gradle", "build.gradle.kts"):
                  continue
              original = path.read_text(errors="ignore")
              updated = original

              # Normalize Android Java compatibility declarations.
              updated = re.sub(
                  r'(?m)^(\s*(?:sourceCompatibility|targetCompatibility)\s*=\s*).*$',
                  lambda m: m.group(1) + ('JavaVersion.VERSION_17' if path.suffix == ".gradle" else 'JavaVersion.VERSION_17'),
                  updated
              )

              # Normalize Kotlin JVM target declarations in both DSL styles.
              updated = re.sub(r'(?m)^(\s*jvmTarget\s*=\s*)["\'](?:1\.8|8|11|17)["\'].*$', r'\g<1>"17"', updated)
              updated = updated.replace("VERSION_1_8", "VERSION_17")
              updated = updated.replace("VERSION_8", "VERSION_17")
              updated = updated.replace('JavaVersion.toVersion("1.8")', 'JavaVersion.VERSION_17')
              updated = updated.replace("JavaVersion.toVersion('1.8')", "JavaVersion.VERSION_17")

              if updated != original:
                  path.write_text(updated)
                  print("Updated Java/Kotlin target in", path)
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionStudioAI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
