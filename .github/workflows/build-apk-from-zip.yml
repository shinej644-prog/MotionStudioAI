name: Build MotionStudioAI APK from uploaded project ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE="MotionStudioAI_ReadyToBuild.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name 'settings.gradle.kts' -printf '%h\\n' -quit)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts inside the uploaded ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin targets in extracted project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("extracted")
          replacements = [
              ("VERSION_1_8", "VERSION_17"),
              ("VERSION_8", "VERSION_17"),
              ('jvmTarget = "1.8"', 'jvmTarget = "17"'),
              ("jvmTarget = '1.8'", "jvmTarget = '17'"),
              ('sourceCompatibility = "1.8"', 'sourceCompatibility = "17"'),
              ("sourceCompatibility = '1.8'", "sourceCompatibility = '17'"),
              ('targetCompatibility = "1.8"', 'targetCompatibility = "17"'),
              ("targetCompatibility = '1.8'", "targetCompatibility = '17'"),
          ]
          for path in root.rglob("*"):
              if path.is_file() and path.name in ("build.gradle", "build.gradle.kts"):
                  original = path.read_text(errors="ignore")
                  updated = original
                  for before, after in replacements:
                      updated = updated.replace(before, after)
                  if updated != original:
                      path.write_text(updated)
                      print("Updated Java/Kotlin target in", path)
          PY

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionStudioAI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
